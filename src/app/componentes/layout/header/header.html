<header id="header">
    <button type="button" class="btn-close" data-bs-dismiss="area-logo" title="Fechar menu" (click)="menu('close')"></button>
    <button type="button" class="btn menu" (click)="menu('open')" title="Menu">
        <img src="/imagens/icones/menu.png" alt="icone menu">
    </button>
    <div class="area-logo">
        <img src="/imagens/logo/energisa-logo.png" alt="LOGO">
    </div>
    
    @if(this.width < 650){
        <app-menu-mobile></app-menu-mobile>
    }
    @if(this.width >= 650){
        <div class="area-menu">
            <ul>
                <li>
                    <a routerLink="">Inicio</a>
                </li>
                <li>
                    <a routerLink="">Para você</a>
                </li>
                <li>
                    <a routerLink="">Sobre nós</a>
                </li>
                <li>
                    <a routerLink="">Investidores</a>
                </li>
                <li>
                    <a routerLink="login">Entrar</a>
                </li>
            </ul>
        </div>
    }

    <div class="copy">
        <p>&copy; 2025 Deyvid e Antony - Todos os direitos reservados. Energia acessível para todos..</p>
    </div>
</header>
