<div class="conteudo">
    <div class="ladoEsquerdo">
        <div class="formBranco">
            <div class="logo">
                <img src="" alt="LOGO_HELPDESK">
            </div>
            <div class="msgLogin">
                <p>MENSAGENS DE BOAS-VINDAS DE VOLTA</p>
            </div>
            <form [formGroup]="form" class="formBranco">
                <div class="inputcpf">
                    <label for="cpf">Digite seu <strong>CPF</strong> ou <strong>CNPJ</strong></label><br>
                    <input type="text" formControlName="cpf" id="cpf" placeholder="CPF/CNPJ">
                </div>
                <div class="inputsenha">
                    <label for="senha">Digite sua <strong>senha</strong></label><br>
                    <input type="password" formControlName="senha" id="senha" placeholder="SENHA">
                </div>
                <a href="">Esqueci minha senha</a><br>
                <a href="">Ainda não possui cadastro?</a><br>
                <button>ENTRAR</button>
            </form>
        </div>
    </div>

    <div class="ladoDireito">
        <img src="" alt="IMAGEM DE FUNDO DIREITA">
    </div>

</div>
